name: CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'components/**'
      - 'plugins/intellij-casehub/**'
      - 'examples/**'
      - 'package.json'
      - 'yarn.lock'
      - '.yarnrc.yml'
      - 'tsconfig*.json'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/**'
      - 'components/**'
      - 'plugins/intellij-casehub/**'
      - 'examples/**'
      - 'package.json'
      - 'yarn.lock'
      - '.yarnrc.yml'
      - 'tsconfig*.json'
      - '.github/workflows/ci.yml'

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Resolve pages packages from Maven
        run: mvn -f npm-packages/pom.xml initialize
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      - name: Build packages
        run: yarn build

      - name: Type check
        run: yarn typecheck

      - name: Run tests
        run: yarn test

  intellij-plugin:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Resolve pages packages from Maven
        run: mvn -f npm-packages/pom.xml initialize
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      - name: Build packages
        run: yarn build

      - name: Build diagram bundle
        run: yarn --cwd packages/lsp-schemas build:diagram

      - name: Build LSP server bundle
        run: yarn --cwd packages/lsp-schemas build:bundle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build IntelliJ plugin
        run: ./gradlew buildPlugin
        working-directory: plugins/intellij-casehub

      - name: Upload plugin artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: intellij-casehub-plugin
          path: plugins/intellij-casehub/build/distributions/*.zip
          retention-days: 30
