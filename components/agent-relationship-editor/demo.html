<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Agent Relationship Editor Demo</title>
  <style>
    body {
      font-family: system-ui;
      background: #1a1a2e;
      color: #e0e0e0;
      margin: 0; padding: 20px;
      --pages-font-family: system-ui;
      --pages-neutral-1: #1e1e2e;
      --pages-neutral-2: #252538;
      --pages-neutral-3: #2d2d44;
      --pages-neutral-4: #3a3a52;
      --pages-neutral-5: #4a4a62;
      --pages-neutral-8: #888;
      --pages-neutral-9: #999;
      --pages-neutral-11: #ccc;
      --pages-neutral-12: #eee;
      --pages-text-secondary: #888;
      --pages-accent-3: #1e3a5f;
      --pages-accent-7: #3b82f6;
      --pages-accent-9: #2563eb;
      --pages-accent-11: #93c5fd;
      --pages-accent-contrast: #fff;
      --pages-success-2: #0a2e1a;
      --pages-success-6: #16a34a;
      --pages-danger-2: #2e1a1a;
      --pages-danger-9: #ef4444;
      --pages-radius-2: 4px;
      --pages-radius-3: 8px;
      --pages-space-2: 0.5rem;
      --pages-space-3: 0.75rem;
      --pages-space-4: 1rem;
    }
    h1 { color: #93c5fd; margin: 0 0 16px; font-size: 20px; }
    agent-relationship-editor { display: block; max-width: 900px; min-height: 400px; }
    #event-log { margin-top: 12px; padding: 10px; background: #252538; border-radius: 8px; font-size: 12px; min-height: 30px; white-space: pre-wrap; max-width: 900px; }
  </style>
</head>
<body>
  <h1>Agent Relationship Editor — Gastown Org</h1>
  <agent-relationship-editor tenancy-id="gastown"></agent-relationship-editor>
  <div id="event-log">Events will appear here...</div>

  <script type="module">
    import('./src/agent-relationship-editor.ts').then(() => {
      const el = document.querySelector('agent-relationship-editor');

      el.agentId = 'boot';
      el.roster = [
        { agentId: 'boot', name: 'Boot', unitId: 'oversight' },
        { agentId: 'deacon', name: 'Deacon', unitId: 'oversight' },
        { agentId: 'witness-alpha', name: 'Witness Alpha', unitId: 'rig-alpha' },
        { agentId: 'polecat-1', name: 'Polecat 1', unitId: 'rig-alpha' },
        { agentId: 'polecat-2', name: 'Polecat 2', unitId: 'rig-alpha' },
        { agentId: 'witness-beta', name: 'Witness Beta', unitId: 'rig-beta' },
        { agentId: 'polecat-3', name: 'Polecat 3', unitId: 'rig-beta' },
      ];
      el.relationships = [
        { sourceAgentId: 'boot', targetAgentId: 'deacon', kind: 'SUPERVISES', tenancyId: 'gastown' },
        { sourceAgentId: 'deacon', targetAgentId: 'witness-alpha', kind: 'SUPERVISES', tenancyId: 'gastown', scope: { capabilityName: 'rig-monitoring' } },
        { sourceAgentId: 'deacon', targetAgentId: 'witness-beta', kind: 'SUPERVISES', tenancyId: 'gastown', scope: { capabilityName: 'rig-monitoring' } },
        { sourceAgentId: 'witness-alpha', targetAgentId: 'polecat-1', kind: 'SUPERVISES', tenancyId: 'gastown' },
        { sourceAgentId: 'witness-alpha', targetAgentId: 'polecat-2', kind: 'SUPERVISES', tenancyId: 'gastown' },
        { sourceAgentId: 'witness-beta', targetAgentId: 'polecat-3', kind: 'SUPERVISES', tenancyId: 'gastown' },
        { sourceAgentId: 'polecat-1', targetAgentId: 'witness-alpha', kind: 'ESCALATES_TO', tenancyId: 'gastown' },
        { sourceAgentId: 'witness-alpha', targetAgentId: 'deacon', kind: 'ESCALATES_TO', tenancyId: 'gastown' },
        { sourceAgentId: 'deacon', targetAgentId: 'boot', kind: 'ESCALATES_TO', tenancyId: 'gastown' },
        { sourceAgentId: 'polecat-1', targetAgentId: 'polecat-2', kind: 'BACKS_UP', tenancyId: 'gastown', scope: { capabilityName: 'code-analysis' } },
        { sourceAgentId: 'polecat-1', targetAgentId: 'deacon', kind: 'REPORTS_TO', tenancyId: 'gastown' },
      ];
      el.agents = {
        boot: { avatar: 'mythic:P1b', profession: 'Software', role: 'Architect' },
        deacon: { avatar: 'mythic:P15', profession: 'Software', role: 'QA Lead' },
        'witness-alpha': { avatar: 'mythic:P14', profession: 'Software', role: 'DevOps' },
        'witness-beta': { avatar: 'mythic:P17', profession: 'Software', role: 'DevOps' },
        'polecat-1': { avatar: 'mythic:P4', profession: 'Software', role: 'Developer' },
        'polecat-2': { avatar: 'mythic:Pj', profession: 'Software', role: 'Developer' },
        'polecat-3': { avatar: 'mythic:P8', profession: 'Software', role: 'Developer' },
      };

      const log = document.getElementById('event-log');
      el.addEventListener('pages-event', (e) => {
        const { topic, payload } = e.detail;
        if (topic === 'relationship:changed') {
          log.textContent = `Event: ${topic}\n` +
            `Additions: ${JSON.stringify(payload?.additions || [], null, 2)}\n` +
            `Removals: ${JSON.stringify(payload?.removals || [], null, 2)}`;
        } else {
          log.textContent = `Event: ${topic}\nPayload: ${JSON.stringify(payload, null, 2)}`;
        }
      });
    });
  </script>
</body>
</html>
